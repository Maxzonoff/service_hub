# ─────────────────────────────────────────────
# Nginx — конфиг для продакшена (внутри docker-compose)
# Проксирует запросы на Gunicorn, отдаёт статику и медиа
# ─────────────────────────────────────────────
upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name servicehub.ru www.servicehub.ru;

    client_max_body_size 20M;

    # Статика Django
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # Медиа (загруженные файлы)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Прокси на Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}