{% extends 'base.html' %}
{% block title %}Редактировать профиль{% endblock %}
{% block content %}

<section class="section auth-section">
    <div class="container">
        <div class="auth-card auth-card-wide">
            <h1>Редактировать профиль</h1>
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
                </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-fill">Сохранить</button>
                    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</section>

{% endblock %}
