# ─────────────────────────────────────────────
# docker-compose для ПРОДАКШЕНА
#
# Запускает 6 сервисов:
#   db           — PostgreSQL 16
#   redis        — Redis 7
#   web          — Django + Gunicorn
#   celery       — воркер задач (email, SMS)
#   celery-beat  — планировщик периодических задач
#   nginx        — веб-сервер (проксирует на web)
#
# Запуск:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Остановка:
#   docker compose -f docker-compose.prod.yml down
# ─────────────────────────────────────────────
version: "3.9"

services:
  # ─────────────────────────────
  # PostgreSQL — база данных
  # ─────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────
  # Redis — брокер для Celery
  # ─────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend

  # ─────────────────────────────
  # Django + Gunicorn — приложение
  # ─────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

  # ─────────────────────────────
  # Celery worker — обработка задач
  # ─────────────────────────────
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    command: celery -A config worker -l info
    env_file: .env.prod
    depends_on:
      - db
      - redis
    networks:
      - backend

  # ─────────────────────────────
  # Celery beat — планировщик
  # ─────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env.prod
    depends_on:
      - db
      - redis
    networks:
      - backend

  # ─────────────────────────────
  # Nginx — веб-сервер
  # ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - backend

# ─────────────────────────────
# Volumes (постоянные хранилища данных)
# ─────────────────────────────
volumes:
  postgres_data:
  static_data:
  media_data:

# ─────────────────────────────
# Сети
# ─────────────────────────────
networks:
  backend:
    driver: bridge