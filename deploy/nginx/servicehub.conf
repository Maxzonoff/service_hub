# ─────────────────────────────────────────────
# Nginx-конфиг для Service Hub (без Docker)
# Разместить в /etc/nginx/sites-available/servicehub
# Активировать:
#   sudo ln -s /etc/nginx/sites-available/servicehub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────

server {
    listen 80;
    server_name servicehub.ru www.servicehub.ru;

    client_max_body_size 20M;

    # Статика Django
    location /static/ {
        alias /home/deploy/service_hub/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Медиа (загруженные файлы)
    location /media/ {
        alias /home/deploy/service_hub/media/;
        expires 7d;
        access_log off;
    }

    # Проксирование на Gunicorn через unix-сокет
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/deploy/service_hub/gunicorn.sock;
        proxy_read_timeout 120s;
    }
}