[project]
name = "service-hub"
version = "0.1.0"
description = "Service Hub — сайт бытовых услуг (сантехника, электрика, потолки, грузчики, муж на час)"
authors = [
    { name = "MaxZ", email = "maxzonoff@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=5.0,<5.1)",
    "psycopg[binary] (>=3.1,<3.2)",
    "python-decouple (==3.8)",
    "pillow (>=10.4,<10.5)",
    "django-widget-tweaks (>=1.5,<1.6)",
    "whitenoise (>=6.7,<6.8)",
    "gunicorn (>=23.0,<24.0)",
    "django-celery-beat (>=2.7,<2.8)",
    "django-axes (>=6.5,<6.6)",
    "celery (>=5.4,<5.5)",
    "redis (>=5.0,<5.1)",
    "django-extensions (>=3.2,<3.3)",
    "python-slugify (>=8.0,<8.1)",
    "django-ckeditor-5 (>=0.2.20,<0.3.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = ">=24.10,<24.11"
ruff = ">=0.6,<0.7"
django-debug-toolbar = ">=4.4,<4.5"
ipython = ">=8.27,<8.28"

[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"